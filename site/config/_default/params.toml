mainSections   = ["post"]
rssFullContent = true
favicon        = "img/avatar.png"

[footer]
    since = 2026

[sidebar]
    emoji    = "🎵"
    subtitle = "南朝四百八十寺，多少楼台烟雨中。"
    avatar   = "img/avatar.png"
    compact  = false

[article]
    [article.license]
        enabled = true
        default = "Licensed under [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/)"

[widgets]
    homepage = [
        { type = "search" },
        { type = "archives", params = { limit = 5 } },
        { type = "categories", params = { limit = 10 } },
        { type = "tag-cloud", params = { limit = 10 } },
    ]
    page     = [{ type = "toc" }]

[comments]
    # Comments are off for the whole site. With the theme's default (enabled = true) every
    # single page falls back to Hugo's internal Disqus partial, which prints "Disqus comments
    # not available by default when the website is previewed locally." in local previews.
    enabled  = false
    provider = "disqus"

# GDPR Cookie Consent Configuration
# When enabled, analytics and functional cookies require user consent
[cookies]
    enabled = false

    [cookies.categories]
        analytics  = true
        functional = true

[colorScheme]
    default = "auto"
